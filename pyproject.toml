[project]
name = "grant-pulse"
version = "0.1.0"
description = "Sistema de monitoreo de fondos de financiamiento gubernamentales chilenos"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  # API
  "fastapi>=0.111.0",
  "uvicorn>=0.30.1",
  # Validación y configuración
  "pydantic>=2.7.4",
  "pydantic-settings>=2.3.3",
  # Base de datos
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.1",
  "asyncpg>=0.29.0",
  # HTTP y scraping
  "httpx>=0.27.0",
  "selectolax>=0.3.21",
  "markdownify>=0.11.0",
  "curl_cffi>=0.5.0",
  "playwright>=1.44.0",
  "trafilatura>=1.11.0",
  "jellyfish>=1.1.0",
  # LLM
  "groq>=1.2.0",
  # Logging y utilidades
  "structlog>=24.2.0",
  "pyyaml>=6.0.1",
  # Notificaciones
  "aiosmtplib>=3.0.1",
]

[project.scripts]
grantpulse-api = "src.presentation.api.main:run"
grantpulse-sync = "src.infra.cli:main"
grantpulse-clean = "src.infra.maintenance:run_clean_db"
grantpulse-purge = "src.infra.cli:main"

[project.optional-dependencies]
# Browser extras — stealth y anti-detección (playwright ya está en dependencias base)
browser = [
    "playwright-stealth>=2.0.3",
    "camoufox>=0.4.11",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.9",
    "respx>=0.21.1",
    "types-pyyaml>=6.0.12.20240311",
]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["build", "alembic", "venv", ".venv"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG",# flake8-unused-arguments
]
ignore = ["E501"] # Ignore line length as we'll use a formatter

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["build", "alembic", "venv", ".venv"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/node_modules", "**/__pycache__", "venv", ".venv", "build", "alembic"]
venvPath = "."
venv = "venv"
pythonVersion = "3.13"
pythonPlatform = "Linux"
typeCheckingMode = "strict"
reportPrivateUsage = "warning"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::DeprecationWarning:fastapi.*",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.uv]
package = true
