  link_detalle: "a.btn"
region_defecto: "Nacional"
normalizadores: {}
alertas:
  campos_sensibles: ["titulo"]
  ignorar_cambios_en: ["descripcion"]

llm_prompt_hint: |
  FOSIS (Fondo de Solidaridad e Inversión Social) financia programas sociales
  dirigidos a personas y familias en situación de pobreza y vulnerabilidad.
  Sus programas incluyen: Apoyo al Trabajo, Yo Emprendo, Fondo Concursable.
  Los beneficiarios son personas naturales, no empresas.
  El financiamiento cubre capacitación, emprendimiento básico y herramientas.
  Requisitos clave: registro en RSH (Registro Social de Hogares),
  porcentaje de vulnerabilidad, zona geográfica específica.
  Busca si requiere postulación individual o grupal y monto del subsidio.

