nombre: "CORFO"
url_busqueda: "https://www.corfo.gob.cl/sites/cpp/programasyconvocatorias/"
estrategia: "wp_ajax"

fallback_steps:
  - estrategia: "cloudflare"
    url: "https://www.corfo.gob.cl/sites/cpp/programasyconvocatorias/"
    nota: "Fallback via Cloudflare Browser Rendering"
selectores:
  contenedor_items: ".caja-resultados_uno"
  identificador: "h4"
  titulo: "h4"
  descripcion: ".contenido-caja_prog > p"
  link_detalle: ".foot-caja_result a"
  estado: "h6"
  fecha_cierre: ".cierre span"
  region: ".contenido-caja_prog"

normalizadores:
  fecha_cierre:
    regex_extraction: "(?:Cierre:?\\s*)?(\\d{1,2}\\s+de\\s+[A-Za-z]+(?:[\\s,]+(?:de\\s+|del\\s+)?)?\\d{4}|\\d{1,2}[/\\-\\.]\\d{1,2}[/\\-\\.]\\d{2,4})"
  cupo:
    regex_extraction: "[Cc]upo[s]?:\\s*(\\d+)"
    tipo_dato: "int"
  porcentaje_cofinanciamiento:
    regex_extraction: "[Cc]o[\\-\\s]?financiamiento:\\s*(?:hasta\\s+(?:el\\s+)?)?(\\d{1,3})\\s*%"
    tipo_dato: "float"
  plazo_ejecucion_meses:
    regex_extraction: "(?:[Pp]lazo|[Dd]uraci[oó]n)(?:\\s+de\\s+ejecuci[oó]n)?:\\s*(?:hasta\\s+)?(\\d+)\\s*mes"
    tipo_dato: "int"
  tipo_beneficiario:
    regex_extraction: "(?:[Dd]irigido\\s+a|[Bb]eneficiarios?|[Pp]ara):\\s*([^\\.|]+)"
    tipo_dato: "mapeo_canonico"
    mapeo_canonico:
      mipes: "MIPE"
      microempresa: "MIPE"
      persona: "Persona natural"
      empresa: "Empresa"
      pyme: "Empresa"
  instrumento:
    regex_extraction: "(?:[Ii]nstrumento|[Tt]ipo|[Mm]odalidad):\\s*([A-Za-záéíóú]+)"
    tipo_dato: "mapeo_canonico"
    mapeo_canonico:
      subsidio: "Subsidio"
      credito: "Crédito"
      garantia: "Garantía"
      concurso: "Concurso"

regiones_defecto:
  - "Nacional"

llm_prompt_hint: |
  CORFO (Corporación de Fomento de la Producción) financia innovación, emprendimiento,
  competitividad y desarrollo productivo en Chile. Sus instrumentos incluyen subsidios
  no reembolsables, garantias, créditos blandos y asistencia técnica.
  Beneficiarios habituales: startups, PYMES, cooperativas, centros de investigación.
  Los montos se expresan en pesos chilenos (CLP) o UF.
  Busca especialmente: requisitos de ventas anuales, años de funcionamiento mínimos,
  sectores excluidos (ej: sector financiero, inmobiliario, retail puro),
  y si requiere cofinanciamiento del postulante.

alertas:
  campos_sensibles:
    - "estado"
    - "fecha_cierre"
  ignorar_cambios_en:
    - "descripcion"
