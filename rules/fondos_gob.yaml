nombre: "Portal Fondos del Estado"
url_busqueda: "https://fondos.gob.cl/"
estrategia: "html_static"

# NOTA: La homepage de fondos.gob.cl muestra solo ~6 fondos destacados.
# El portal tiene muchos más fondos pero requieren búsqueda/filtros interactivos.
# Por ahora monitorizamos los destacados — es el conjunto visible más estable.
#
# Estructura real de cada item (es un <a href="/ficha/...">):
#   .badge           → estado (ABIERTO/CERRADO)
#   h6               → título (solo el título del fondo, no incluye institución)
#   texto completo   → "ABIERTONacionalInstitución\nTítulo\nBeneficiarios/as:...\nFechas:Inicio: DD-MM-YYYY|Fin: DD-MM-YYYY\nMontos:..."

selectores:
  contenedor_items: "a[href^='/ficha/']"
  identificador: "h6"
  titulo: "h6"
  descripcion: "self"
  link_detalle: "attr:href"     # el href del propio <a> contenedor
  estado: ".badge"
  fecha_cierre: null            # En el texto del item: "Fin: DD-MM-YYYY"
  fecha_apertura: null          # En el texto del item: "Inicio: DD-MM-YYYY"
  monto: null                   # En el texto del item: "Hasta $X.XXX.XXX"
region_defecto: "Nacional"
normalizadores:
  fecha_cierre:
    regex_extraction: "Fin:\\s*(\\d{2}-\\d{2}-\\d{4})"
    formato_salida: "%d-%m-%Y"
  fecha_apertura:
    regex_extraction: "Inicio:\\s*(\\d{2}-\\d{2}-\\d{4})"
    formato_salida: "%d-%m-%Y"
  monto:
    regex_extraction: "Montos:[^\\n]*?([\\$\\d\\.]+(?:\\s+(?:a|hasta)\\s+[\\$\\d\\.]+)?)"
  cupo:
    regex_extraction: "[Cc]upo[s]?:\\s*(\\d+)"
    tipo_dato: "int"
  porcentaje_cofinanciamiento:
    regex_extraction: "[Cc]o[\\-\\s]?financiamiento:\\s*(?:hasta\\s+(?:el\\s+)?)?(\\d{1,3})\\s*%"
    tipo_dato: "float"
  plazo_ejecucion_meses:
    regex_extraction: "(?:[Pp]lazo|[Dd]uraci[oó]n)(?:\\s+de\\s+ejecuci[oó]n)?:\\s*(?:hasta\\s+)?(\\d+)\\s*mes"
    tipo_dato: "int"
  tipo_beneficiario:
    regex_extraction: "(?:[Dd]irigido\\s+a|[Bb]eneficiarios?|[Pp]ara):\\s*([^\\.|]+)"
    tipo_dato: "mapeo_canonico"
    mapeo_canonico:
      mipes: "MIPE"
      microempresa: "MIPE"
      persona: "Persona natural"
      empresa: "Empresa"
      pyme: "Empresa"
  instrumento:
    regex_extraction: "(?:[Ii]nstrumento|[Tt]ipo|[Mm]odalidad):\\s*([A-Za-záéíóú]+)"
    tipo_dato: "mapeo_canonico"
    mapeo_canonico:
      subsidio: "Subsidio"
      credito: "Crédito"
      garantia: "Garantía"
      concurso: "Concurso"
  area_financiamiento:
    regex_extraction: "(?:[AÁ]rea|[Ss]ector):\\s*([^\\.|]+)"
    tipo_dato: "mapeo_canonico"
    mapeo_canonico:
      innovacion: "Innovación"
      innovación: "Innovación"
      emprendimiento: "Emprendimiento"
      investigacion: "Investigación"
      investigación: "Investigación"

alertas:
  campos_sensibles:
    - "estado"
    - "titulo"
