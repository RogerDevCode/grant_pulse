services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=America/Santiago
    ports:
      - "${APP_PORT:-8002}:8000"
    volumes:
      # Persiste la BD SQLite entre reinicios locales
      - grantpulse_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/python -c \"from urllib.request import urlopen; urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "grantpulse.api"

volumes:
  grantpulse_data:
